quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:demo}
quarkus.datasource.password=${DB_PASSWORD:demo-local-only}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/inventory}
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.schema-management.strategy=none
