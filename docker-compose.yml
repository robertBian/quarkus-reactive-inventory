services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
    ports: ["5432:5432"]
    volumes:
      - inventory_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  inventory_pg:
